<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>super HARNESS</title>
    <script>
      window.__superStartTime = performance.now();
      try {
        var theme = localStorage.getItem("super_theme");
        if (theme === "dark" || (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}

      window.__dismissSuperSplash = function() {
        var splash = document.getElementById("app-startup-splash");
        if (!splash || splash.dataset.dismissed) return;
        splash.dataset.dismissed = "true";
        var elapsed = performance.now() - (window.__superStartTime || performance.now());
        var remaining = Math.max(0, 500 - elapsed);
        setTimeout(function() {
          splash.style.opacity = "0";
          splash.style.transform = "scale(1.02)";
          splash.style.pointerEvents = "none";
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 450);
        }, remaining);
      };

      // 兜底保护：若初始化异常，3.5 秒后自动淡出
      setTimeout(function() {
        if (typeof window.__dismissSuperSplash === "function") {
          window.__dismissSuperSplash();
        }
      }, 3500);
    </script>
    <style>
      #app-startup-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        user-select: none;
        overflow: hidden;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .dark #app-startup-splash {
        background: #0f1117;
      }

      /* 柔和水感环境光晕 */
      .splash-bg-glow {
        position: absolute;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.16) 0%, rgba(99, 102, 241, 0.06) 50%, transparent 75%);
        filter: blur(45px);
        animation: splashAura 3.6s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .dark .splash-bg-glow {
        background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 75%);
      }

      @keyframes splashAura {
        0% { transform: scale(0.92); opacity: 0.6; }
        100% { transform: scale(1.08); opacity: 0.95; }
      }

      /* Logo 容器：居中呼吸动效，无文字与进度条 */
      .splash-logo-wrapper {
        position: relative;
        width: 136px;
        height: 136px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        animation: logoBreathing 3.2s ease-in-out infinite alternate;
      }

      @keyframes logoBreathing {
        0% { transform: translateY(0px) scale(0.98); }
        100% { transform: translateY(-3px) scale(1.02); }
      }

      /* 1. Logo 虚化层 (对标需求：logo 虚化背景柔光效果) */
      .splash-logo-blur {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: blur(12px) drop-shadow(0 0 20px rgba(56, 189, 248, 0.55));
        opacity: 0.65;
        pointer-events: none;
        animation: blurPulse 3.2s ease-in-out infinite alternate;
      }
      .dark .splash-logo-blur {
        filter: blur(14px) drop-shadow(0 0 24px rgba(56, 189, 248, 0.7));
        opacity: 0.75;
      }

      @keyframes blurPulse {
        0% { opacity: 0.5; filter: blur(10px) drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
        100% { opacity: 0.8; filter: blur(15px) drop-shadow(0 0 28px rgba(56, 189, 248, 0.75)); }
      }

      /* 2. Logo 清晰主体层：照着原生 Logo 完美渲染细腻精致的线条 */
      .splash-logo-base {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        z-index: 3;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
      }
      .dark .splash-logo-base {
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.45));
      }

      /* 3. 循环流光层：贴合原生 Logo 透明遮罩的高级流光不断穿梭循环 */
      .splash-logo-shimmer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 4;
        -webkit-mask-image: url("./logo.png");
        mask-image: url("./logo.png");
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background: linear-gradient(
          125deg,
          transparent 20%,
          rgba(56, 189, 248, 0.25) 38%,
          rgba(255, 255, 255, 0.95) 50%,
          rgba(56, 189, 248, 0.25) 62%,
          transparent 80%
        );
        background-size: 260% 260%;
        animation: logoShimmerCycle 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        mix-blend-mode: overlay;
      }
      .dark .splash-logo-shimmer {
        background: linear-gradient(
          125deg,
          transparent 20%,
          rgba(56, 189, 248, 0.35) 38%,
          rgba(255, 255, 255, 1) 50%,
          rgba(56, 189, 248, 0.35) 62%,
          transparent 80%
        );
        mix-blend-mode: screen;
      }

      @keyframes logoShimmerCycle {
        0% { background-position: 180% 180%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { background-position: -80% -80%; opacity: 0; }
      }

      /* 4. 沿线条循环跑动的极细高亮脉冲光 */
      .splash-flow-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
      }

      .splash-flow-line {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 1.8px;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px #38bdf8) drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
        stroke-dasharray: 40 220;
        animation: lineFlowCirculate 2.4s linear infinite;
      }

      .splash-flow-line-2 {
        animation-delay: -1.2s;
        stroke-dasharray: 35 180;
      }

      @keyframes lineFlowCirculate {
        0% { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body class="bg-[#ffffff] text-[#111827] antialiased overflow-hidden select-text">
    <!-- 应用启动全屏极简质感 Splash -->
    <div id="app-startup-splash">
      <div class="splash-bg-glow"></div>

      <div class="splash-logo-wrapper">
        <!-- 虚化柔光背景层 (logo 虚化) -->
        <img src="./logo.png" alt="super logo glow" class="splash-logo-blur" />

        <!-- 原生高清 Logo 主体 (细腻精简线条) -->
        <img src="./logo.png" alt="super logo" class="splash-logo-base" />

        <!-- 线条中持续循环穿梭的流光遮罩层 -->
        <div class="splash-logo-shimmer"></div>

        <!-- 矢量流光循环跑动轨迹 (精细微光) -->
        <svg class="splash-flow-svg" viewBox="0 0 253 257">
          <!-- 外层主旋臂线 -->
          <path class="splash-flow-line" d="M 128.5 138 C 110 160, 85 204, 30 170 C 18 120, 50 40, 130 15 C 220 15, 245 100, 220 160 C 190 200, 150 170, 135 145" />
          <!-- 内层旋臂线 -->
          <path class="splash-flow-line splash-flow-line-2" d="M 128.5 138 C 100 155, 60 180, 50 130 C 50 80, 120 50, 160 63 C 210 80, 225 110, 200 140" />
          <!-- 底部水滴高亮脉冲 -->
          <circle cx="128.5" cy="227.5" r="14" class="splash-flow-line" style="stroke-dasharray: 20 80; stroke-width: 1.5px;" />
        </svg>
      </div>
    </div>

    <div id="root" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
